<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mutely: Your ringer, on autopilot.</title>
    <meta
      name="description"
      content="Mutely switches your Android phone to Silent, Vibrate or Loud when you arrive at the places you choose, and restores it when you leave. No account, no tracking."
    />
    <link rel="canonical" href="https://mutely.app/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0e12" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mutely" />
    <meta property="og:title" content="Mutely: Your ringer, on autopilot." />
    <meta
      property="og:description"
      content="Mutely switches your Android phone to Silent, Vibrate or Loud when you arrive at the places you choose, and restores it when you leave. No account, no tracking."
    />
    <meta name="twitter:card" content="summary" />

    <!-- Apply a saved theme before first paint so there is no light/dark flash. -->
    <script>
      try {
        var t = localStorage.getItem('mutely-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
